[project]
name = "operations"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Kulunchick", email = "nikolikrasovski@gmail.com" }
]
dependencies = [
    "numpy>=2.2.4",
    "fastapi>=0.115.12",
    "websockets>=15.0.1",
    "uvicorn>=0.34.2",
    "assignment-solver>=0.5.0",
    "cffi>=1.17.1",
    "temporalio>=1.7.0",
    "redis>=5.0.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic[email]>=2.11",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.1",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
    "shared",
]
readme = "README.md"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.0",
    "psycopg2-binary>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.uv.sources]
shared = { path = "../../libs/shared" }

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/operations"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Share one event loop across all tests + async fixtures so the asyncpg engine's
# connections stay valid (avoids cross-loop "Event loop is closed" on teardown).
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = [
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
    "ignore::UserWarning:temporalio",
]
