[project]
name = "coursework-worker"
version = "0.1.0"
description = "Temporal worker and experiment specs for coursework-operations"
authors = [
    { name = "Kulunchick", email = "nikolikrasovski@gmail.com" }
]
dependencies = [
    "numpy>=2.2.4",
    "assignment-solver>=0.5.0",
    "temporalio>=1.7.0",
    "redis>=5.0.0",
    "pydantic>=2.11.4",
]
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker", "src/experiments"]
