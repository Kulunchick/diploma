[project]
name = "worker"
version = "0.1.0"
description = "Temporal worker and experiment specs"
authors = [
    { name = "Kulunchick", email = "nikolikrasovski@gmail.com" }
]
dependencies = [
    "numpy>=2.2.4",
    "assignment-solver>=0.5.0",
    "temporalio>=1.7.0",
    "redis>=5.0.0",
    "pydantic>=2.11.4",
    "shared",
]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.uv.sources]
shared = { path = "../../libs/shared" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker", "src/experiments"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
    "ignore::UserWarning:temporalio",
]
