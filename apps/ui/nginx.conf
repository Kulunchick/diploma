# Full nginx config — replaces /etc/nginx/nginx.conf in the container.
# No "user" directive: the process runs as the uid set by Dockerfile USER / k8s runAsUser.

worker_processes auto;
pid /tmp/nginx.pid;

error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Temp paths under /tmp so non-root nginx can write them.
    # In k8s these land on the emptyDir mounted at /tmp.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile   on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/css
        application/javascript
        application/json
        application/xml+rss
        image/svg+xml;
    gzip_vary on;

    server {
        listen 8080;
        root  /usr/share/nginx/html;
        index index.html;

        # ---------------------------------------------------------------
        # /config.js — runtime config injected by docker-entrypoint.sh.
        # MUST NOT be cached: a stale config would give the wrong API URL.
        # ---------------------------------------------------------------
        location = /config.js {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            try_files $uri =404;
        }

        # index.html — no-store so the browser always fetches a fresh
        # config.js reference on next load.
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        # Hashed assets produced by Vite (e.g. /assets/index-Abc123.js).
        # Content-hash guarantees freshness; cache forever.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # SPA fallback: unknown paths return index.html so React Router
        # handles the route client-side. Also keeps ?job=<id> deep-links
        # alive on full page reload.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
