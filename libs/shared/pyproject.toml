[project]
name = "shared"
version = "0.1.0"
description = "Shared Pydantic types and constants used by both api and worker"
dependencies = [
    "pydantic>=2.11.4",
]
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]
