apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: operations
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: operations
    spec:
      # ----------------------------------------------------------------
      # initContainer: populate the emptyDir html-vol with static assets
      # and the generated config.js before the main container starts.
      #
      # Why initContainer instead of the entrypoint?
      #   The main container runs with readOnlyRootFilesystem: true.
      #   /usr/share/nginx/html is mounted as an emptyDir, so the image
      #   filesystem is untouched.  The initContainer writes to the
      #   emptyDir, which the main container then serves read-only.
      # ----------------------------------------------------------------
      initContainers:
        - name: init-config
          # TODO: replace with your actual registry and tag
          image: <REGISTRY>/ui:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              cp -rp /usr/share/nginx/html/. /html-vol/
              cat > /html-vol/config.js << EOF
              window.__APP_CONFIG__ = {
                "apiBaseUrl": "${APP_API_BASE_URL}",
                "useTemporalApi": ${APP_USE_TEMPORAL_API}
              };
              EOF
          envFrom:
            - configMapRef:
                name: frontend-config
          volumeMounts:
            - name: html-vol
              mountPath: /html-vol
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false

      containers:
        - name: frontend
          # TODO: replace with your actual registry and tag
          image: <REGISTRY>/ui:latest
          imagePullPolicy: Always
          # Skip docker-entrypoint.sh — config.js already written by initContainer.
          command: ["nginx"]
          args: ["-g", "daemon off;"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: frontend-config
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            # Static assets + generated config.js (written by initContainer)
            - name: html-vol
              mountPath: /usr/share/nginx/html
            # nginx pid (/tmp/nginx.pid) + client_body_temp etc. (see nginx.conf)
            - name: tmp-vol
              mountPath: /tmp

      volumes:
        - name: html-vol
          emptyDir: {}
        - name: tmp-vol
          emptyDir: {}
