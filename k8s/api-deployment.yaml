apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: coursework-operations
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: coursework-operations
    spec:
      containers:
        - name: api
          # Replace with your actual registry and tag before deploying.
          image: <REGISTRY>/coursework-operations:latest
          imagePullPolicy: Always
          command: ["python", "-m", "src.coursework_operations.main"]
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: coursework-config
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
