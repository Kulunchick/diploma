apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker-hpa
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: coursework-operations
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # Workers are CPU-bound (Rust+Rayon). High utilization means tasks are
          # actively running. Scaling out adds pods to increase throughput —
          # each pod handles one activity at a time (concurrency=1 default).
          # Lower this value (e.g. 50) for more aggressive scale-out.
          averageUtilization: 70
  behavior:
    scaleDown:
      # Avoid premature scale-down between experiment runs.
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
