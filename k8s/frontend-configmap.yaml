apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: operations
data:
  # HTTP base path for all API calls.  Ingress routes /api/* to the backend.
  APP_API_BASE_URL: "/api"

  # Runtime feature flag — change here to roll back without rebuilding the image.
  # "true"  → Temporal-backed flow (POST /api/* + WS /api/jobs/{id}/events)
  # "false" → legacy direct-WS flow (currently removed from code, reserved for future)
  APP_USE_TEMPORAL_API: "true"
