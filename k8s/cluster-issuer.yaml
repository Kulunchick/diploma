# ClusterIssuer for cert-manager + Let's Encrypt.
#
# Applied ONCE per cluster after cert-manager is installed.
# Does NOT belong to a specific namespace — cluster-scoped resource.
#
# Usage:
#   kubectl apply -f k8s/cluster-issuer.yaml
#
# Verify:
#   kubectl get clusterissuer letsencrypt-prod -o jsonpath='{.status.conditions}'
#
# IMPORTANT: Let's Encrypt production has strict rate limits.
# Test with letsencrypt-staging first:
#   1. Change server URL to https://acme-staging-v02.api.letsencrypt.org/directory
#   2. Change name to letsencrypt-staging
#   3. Update cert-manager.io/cluster-issuer annotation in frontend-ingress.yaml
# Once staging works, switch to production.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # TODO: replace with your real email address for expiry notifications
    email: TODO_YOUR_EMAIL
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
