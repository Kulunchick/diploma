apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
  labels:
    app.kubernetes.io/part-of: operations
  annotations:
    # ingress-nginx controller (kubernetes/ingress-nginx)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # WebSocket long-poll connections (used by /api/jobs/{id}/events)
    # ingress-nginx handles the Upgrade header automatically; the timeouts
    # above prevent premature closure of WS sessions.

    # TLS certificate via cert-manager (apply cluster-issuer.yaml first)
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx

  tls:
    - hosts:
        # TODO: replace with your actual domain
        - "TODO_YOUR_DOMAIN"
      secretName: tls

  rules:
    # TODO: replace with your actual domain
    - host: "TODO_YOUR_DOMAIN"
      http:
        paths:
          # /api/* → backend FastAPI service
          # More-specific prefix listed first so ingress-nginx matches it
          # before the catch-all /.
          # Backend service name: "api" (k8s/api-service.yaml, port 8000)
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000

          # / → frontend nginx (serves SPA + static assets)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
