server:
  replicaCount: 1
  config:
    persistence:
      numHistoryShards: 4
      datastores:
        default:
          sql:
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal
            connectAddr: "diploma-postgres-postgresql.temporal.svc.cluster.local:5432"
            connectProtocol: tcp
            user: temporal
            password: temporal
            createDatabase: true
            manageSchema: true
        visibility:
          sql:
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal_visibility
            connectAddr: "diploma-postgres-postgresql.temporal.svc.cluster.local:5432"
            connectProtocol: tcp
            user: temporal
            password: temporal
            createDatabase: true
            manageSchema: true
