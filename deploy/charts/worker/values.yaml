image:
  repository: ghcr.io/kulunchick/diploma-worker
  # Default; CI writes the real SHA into deploy/values-production/worker.yaml
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

config:
  temporalHost: "temporal-frontend.temporal.svc.cluster.local:7233"
  temporalNamespace: "default"
  taskQueue: "operations"
  redisUrl: "redis://redis-master.redis.svc.cluster.local:6379"

resources:
  requests:
    cpu: "1000m"
    memory: "512Mi"
  limits:
    cpu: "4000m"
    memory: "2Gi"

hpa:
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

imagePullSecrets: []
# imagePullSecrets:
#   - name: ghcr-pull-secret
