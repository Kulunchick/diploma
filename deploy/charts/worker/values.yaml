image:
  repository: ghcr.io/kulunchick/diploma-worker
  # tag MUST be set in deploy/values-{local,production}/worker.yaml
  # (written by CI on every deploy — immutable 8-char git SHA).
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

config:
  temporalHost: "temporal-frontend.temporal.svc.cluster.local:7233"
  temporalNamespace: "default"
  taskQueue: "operations"
  redisUrl: "redis://redis-master.redis.svc.cluster.local:6379"
  # Async SQLAlchemy URL — used by persist_formation_result_activity to write
  # formation results back. Required: same database as the backend.
  databaseUrl: ""

resources:
  requests:
    cpu: "1000m"
    memory: "512Mi"
  limits:
    cpu: "4000m"
    memory: "2Gi"

hpa:
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

imagePullSecrets: []
# imagePullSecrets:
#   - name: ghcr-pull-secret
