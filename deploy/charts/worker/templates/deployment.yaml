apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "worker.fullname" . }}
  labels:
    {{- include "worker.labels" . | nindent 4 }}
spec:
  # Replica count is managed by HPA — do not set here to avoid conflicts.
  selector:
    matchLabels:
      {{- include "worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "worker.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-temporal
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python
            - -c
            - |
              import socket, time, os
              host, port = os.environ["TEMPORAL_HOST"].split(":")
              while True:
                  try:
                      socket.create_connection((host, int(port)), timeout=2).close()
                      print(f"temporal is ready at {host}:{port}")
                      break
                  except OSError:
                      print(f"waiting for temporal at {host}:{port}...")
                      time.sleep(2)
          envFrom:
            - configMapRef:
                name: {{ include "worker.fullname" . }}-config
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "worker.fullname" . }}-config
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
