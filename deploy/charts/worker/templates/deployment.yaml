apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "worker.fullname" . }}
  labels:
    {{- include "worker.labels" . | nindent 4 }}
spec:
  # Replica count is managed by HPA — do not set here to avoid conflicts.
  selector:
    matchLabels:
      {{- include "worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "worker.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-temporal
          image: busybox:stable
          command:
            - sh
            - -c
            - |
              until nc -z \
                $(echo $TEMPORAL_HOST | cut -d: -f1) \
                $(echo $TEMPORAL_HOST | cut -d: -f2); do
                echo "waiting for temporal at $TEMPORAL_HOST..."; sleep 2
              done
          envFrom:
            - configMapRef:
                name: {{ include "worker.fullname" . }}-config
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ required "image.tag must be set in values-local/worker.yaml or values-production/worker.yaml" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "worker.fullname" . }}-config
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
