apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.name }}
spec:
  acme:
    server: {{ .Values.acme.server | quote }}
    email: {{ required "email is required — set it in values.yaml or via --set email=you@example.com" .Values.email | quote }}
    privateKeySecretRef:
      name: {{ .Values.name }}-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
