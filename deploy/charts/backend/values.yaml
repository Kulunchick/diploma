image:
  repository: ghcr.io/kulunchick/diploma-backend
  # tag MUST be set in deploy/values-{local,production}/backend.yaml
  # (written by CI on every deploy — immutable 8-char git SHA).
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

config:
  temporalHost: "temporal-frontend.temporal.svc.cluster.local:7233"
  temporalNamespace: "default"
  taskQueue: "operations"
  redisUrl: "redis://redis-master.redis.svc.cluster.local:6379"
  # Allowed CORS origins for local dev; in prod same-origin via Ingress
  corsOrigins: ""  # required: your domain, e.g. "https://example.com"
  # Async SQLAlchemy URL for the information-system database (asyncpg driver).
  # Required: e.g. "postgresql+asyncpg://diploma:PASS@postgres.db.svc:5432/diploma"
  databaseUrl: ""

# JWT signing secret for /api/auth — REQUIRED, no default. In production supply
# via a sealed secret / external secret rather than committing it to values.
jwtSecret: ""

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

imagePullSecrets: []
# imagePullSecrets:
#   - name: ghcr-pull-secret
