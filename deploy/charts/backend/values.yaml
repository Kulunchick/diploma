image:
  repository: ghcr.io/kulunchick/diploma-backend
  # tag is set by CI write-back on every deploy (git SHA)
  tag: b9c0a456
  pullPolicy: IfNotPresent

replicaCount: 1

config:
  temporalHost: "temporal-frontend.temporal.svc.cluster.local:7233"
  temporalNamespace: "default"
  taskQueue: "operations"
  redisUrl: "redis://redis-master.redis.svc.cluster.local:6379"
  # Allowed CORS origins for local dev; in prod same-origin via Ingress
  corsOrigins: ""  # required: your domain, e.g. "https://example.com"

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

imagePullSecrets: []
# imagePullSecrets:
#   - name: ghcr-pull-secret
