apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "backend.fullname" . }}-config
  labels:
    {{- include "backend.labels" . | nindent 4 }}
data:
  TEMPORAL_HOST: {{ .Values.config.temporalHost | quote }}
  TEMPORAL_NAMESPACE: {{ .Values.config.temporalNamespace | quote }}
  TASK_QUEUE: {{ .Values.config.taskQueue | quote }}
  REDIS_URL: {{ .Values.config.redisUrl | quote }}
  CORS_ORIGINS: {{ required "config.corsOrigins is required" .Values.config.corsOrigins | quote }}
