apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: diploma-temporal
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  sources:
    - chart: temporal
      repoURL: https://go.temporal.io/helm-charts
      targetRevision: "1.2.0"
      helm:
        valueFiles:
          - $values/deploy/values-local/temporal.yaml
    - repoURL: https://github.com/Kulunchick/diploma
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: temporal
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
