apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: diploma-temporal
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    chart: temporal
    repoURL: https://go.temporal.io/helm-charts
    targetRevision: "1.2.0"
    helm:
      values: |
        server:
          replicaCount: 1
          config:
            persistence:
              numHistoryShards: 4
              datastores:
                default:
                  sql:
                    pluginName: postgres12
                    driverName: postgres12
                    databaseName: temporal
                    connectAddr: "diploma-postgres-postgresql.temporal.svc.cluster.local:5432"
                    connectProtocol: tcp
                    user: temporal
                    password: temporal
                    createDatabase: true
                    manageSchema: true
                visibility:
                  sql:
                    pluginName: postgres12
                    driverName: postgres12
                    databaseName: temporal_visibility
                    connectAddr: "diploma-postgres-postgresql.temporal.svc.cluster.local:5432"
                    connectProtocol: tcp
                    user: temporal
                    password: temporal
                    createDatabase: true
                    manageSchema: true
  destination:
    server: https://kubernetes.default.svc
    namespace: temporal
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
