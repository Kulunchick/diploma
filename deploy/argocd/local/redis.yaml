apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: diploma-redis
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    chart: redis
    repoURL: https://charts.bitnami.com/bitnami
    targetRevision: ">=20.0.0"
    helm:
      values: |
        auth:
          enabled: false
        architecture: standalone
        master:
          persistence:
            enabled: false
        replica:
          replicaCount: 0
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
