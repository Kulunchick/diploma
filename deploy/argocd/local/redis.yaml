apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: diploma-redis
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - chart: redis
      repoURL: https://charts.bitnami.com/bitnami
      targetRevision: ">=20.0.0"
      helm:
        valueFiles:
          - $values/deploy/values-local/redis.yaml
    - repoURL: https://github.com/Kulunchick/diploma
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
