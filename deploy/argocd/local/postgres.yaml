apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: diploma-postgres
  namespace: argocd
spec:
  project: default
  source:
    chart: postgresql
    repoURL: https://charts.bitnami.com/bitnami
    targetRevision: ">=16.0.0"
    helm:
      values: |
        auth:
          username: temporal
          password: temporal
          database: temporal
        primary:
          persistence:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: temporal
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
