apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: diploma-postgres
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  sources:
    - chart: postgresql
      repoURL: registry-1.docker.io/bitnamicharts
      targetRevision: "18.6.6"
      helm:
        valueFiles:
          - $values/deploy/values-local/postgres.yaml
    - repoURL: https://github.com/Kulunchick/diploma
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: temporal
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
