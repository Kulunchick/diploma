apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: diploma-postgres
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Kulunchick/diploma
    targetRevision: main
    path: deploy/k8s/temporal-postgres
  destination:
    server: https://kubernetes.default.svc
    namespace: temporal
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
