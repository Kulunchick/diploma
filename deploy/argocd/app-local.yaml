apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: diploma-local
  namespace: argocd
  # Deleting this Application will cascade-delete all apps it manages
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Kulunchick/diploma
    targetRevision: main
    path: deploy/argocd/local
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
