apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: temporal-db-secret
  namespace: argocd
  annotations:
    # Sync before postgres (-2) so the existingSecret exists when bitnami mounts it.
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  # Plain manifest source (NOT a `ref: values` source) so the Secret in the
  # private diploma-values repo is actually rendered and applied.
  source:
    repoURL: https://github.com/Kulunchick/diploma-values
    targetRevision: main
    path: secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: temporal
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
