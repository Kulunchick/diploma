apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: temporal-namespace-init
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/Kulunchick/diploma
    targetRevision: main
    path: deploy/k8s/production
  destination:
    server: https://kubernetes.default.svc
    namespace: temporal
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
