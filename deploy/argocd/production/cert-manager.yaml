apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    # Must come up before the ClusterIssuer (-1) so its CRDs/webhook exist first.
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    chart: cert-manager
    repoURL: https://charts.jetstack.io
    targetRevision: v1.18.6
    helm:
      values: |
        crds:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # cert-manager's CRDs are too large for client-side apply
      # (annotations exceed 262144 bytes); server-side apply avoids that.
      - ServerSideApply=true
