apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: temporal
  namespace: argocd
spec:
  project: default
  source:
    chart: temporal
    repoURL: https://go.temporal.io/helm-charts
    targetRevision: "0.74.0"
    helm:
      values: |
        server:
          replicaCount: 1
          config:
            persistence:
              defaultStore: default
              visibilityStore: visibility
              default:
                driver: cassandra
                cassandra:
                  hosts:
                    - temporal-cassandra
                  keyspace: temporal
                  replicationFactor: 3
              visibility:
                driver: cassandra
                cassandra:
                  hosts:
                    - temporal-cassandra
                  keyspace: temporal_visibility
                  replicationFactor: 3
        cassandra:
          config:
            cluster_size: 3
        prometheus:
          enabled: false
        grafana:
          enabled: false
        elasticsearch:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: temporal
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
