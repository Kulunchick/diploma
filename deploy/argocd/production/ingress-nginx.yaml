apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  annotations:
    # Up before the app workloads (wave 1) that expose Ingresses, and so the
    # ACME http01 solver has a controller to route challenges through.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    chart: ingress-nginx
    repoURL: https://kubernetes.github.io/ingress-nginx
    # Pinned to 4.9.x: CFKE's quay.io/cloudfleet mirror only carries the
    # controller image up to v1.9.6 (chart 4.9.1 -> controller v1.9.6).
    targetRevision: 4.9.1
    helm:
      # CFKE-specific values (per Cloudfleet's nginx-ingress + cert-manager tutorial):
      #  - quay.io/cloudfleet image mirror for reliability
      #  - externalTrafficPolicy: Local to avoid extra cross-cloud network hops
      #  - watchIngressWithoutClass so unclassed Ingresses are still served
      # NOTE: registry must be set per-image (chart 4.9.x ignores global.image.registry),
      # and digests are cleared because the mirror re-pushes images under flattened
      # names with different digests — so images are pulled by tag.
      values: |
        controller:
          watchIngressWithoutClass: true
          # HA: 2 replicas spread across nodes + PDB, so this spot cluster's
          # node churn doesn't leave the NLB (externalTrafficPolicy: Local)
          # without a healthy target.
          replicaCount: 2
          minAvailable: 1
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: ingress-nginx
                  app.kubernetes.io/instance: ingress-nginx
                  app.kubernetes.io/component: controller
          # Relaxed probes: node CPU starvation on this spot cluster makes the
          # controller healthz slow to answer; the default 1s timeout was
          # failing the liveness probe and killing the pod in a restart loop.
          livenessProbe:
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 10
          readinessProbe:
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 10
          image:
            registry: quay.io/cloudfleet
            image: ingress-nginx-controller
            digest: ""
          admissionWebhooks:
            patch:
              image:
                registry: quay.io/cloudfleet
                image: kube-webhook-certgen
                digest: ""
          service:
            externalTrafficPolicy: Local
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
