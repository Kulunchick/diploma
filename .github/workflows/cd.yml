name: CD

on:
  push:
    branches: [main]

# Never cancel CD mid-run.
# Write-back (added in step 4) must not be interrupted by a concurrent push.
concurrency:
  group: cd
  cancel-in-progress: false

permissions:
  contents: write   # write-back commit + push (step 4)
  packages: write   # ghcr.io image push

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Detect which components changed (identical filters to ci.yml)
  # ──────────────────────────────────────────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend:  ${{ steps.filter.outputs.backend }}
      worker:   ${{ steps.filter.outputs.worker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'apps/ui/**'
            backend:
              - 'apps/api/**'
              - 'libs/operations/**'
              - 'apps/worker/**'
            worker:
              - 'apps/worker/**'
              - 'libs/operations/**'

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Tests — MANDATORY gate before any image is pushed.
  #    An image is never pushed if its component's tests are red.
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Test / ${{ matrix.component }}
    needs: changes
    if: |
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.backend  == 'true' ||
      needs.changes.outputs.worker   == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # run all tests; build-push waits for ALL to succeed
      matrix:
        include:
          - component: frontend
            changed: ${{ needs.changes.outputs.frontend }}
          - component: backend
            changed: ${{ needs.changes.outputs.backend }}
          - component: worker
            changed: ${{ needs.changes.outputs.worker }}
    steps:
      - name: Skip if unchanged
        if: matrix.changed != 'true'
        run: echo "Component ${{ matrix.component }} unchanged — skipping."

      - uses: actions/checkout@v4
        if: matrix.changed == 'true'

      # ── Frontend ──────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        if: matrix.changed == 'true' && matrix.component == 'frontend'
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/ui/package-lock.json

      - name: Frontend — install + lint + typecheck
        if: matrix.changed == 'true' && matrix.component == 'frontend'
        run: npm ci && npm run lint && npx tsc --noEmit
        working-directory: apps/ui

      # ── Backend ───────────────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        if: matrix.changed == 'true' && matrix.component == 'backend'
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v5
        if: matrix.changed == 'true' && matrix.component == 'backend'

      - uses: actions/cache@v4
        if: matrix.changed == 'true' && matrix.component == 'backend'
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('apps/api/uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Backend — install + pytest
        if: matrix.changed == 'true' && matrix.component == 'backend'
        run: |
          uv sync --frozen
          uv run pip install ../worker --no-deps
          uv run pytest tests/ -q
        working-directory: apps/api

      # ── Worker ────────────────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        if: matrix.changed == 'true' && matrix.component == 'worker'
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v5
        if: matrix.changed == 'true' && matrix.component == 'worker'

      - uses: actions/cache@v4
        if: matrix.changed == 'true' && matrix.component == 'worker'
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('apps/api/uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Worker — install + pytest
        if: matrix.changed == 'true' && matrix.component == 'worker'
        run: |
          uv sync --frozen
          uv run pip install ../worker --no-deps
          uv run pytest tests/ -q
        working-directory: apps/api

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Build + push to ghcr.io (only if ALL tests above passed)
  #    Tag: immutable 8-char git SHA.  latest is never used.
  # ──────────────────────────────────────────────────────────────────────────
  build-push:
    name: Build & Push / ${{ matrix.component }}
    needs: [changes, test]
    # Re-check change flags; if test was skipped (nothing changed) this is also false.
    if: |
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.backend  == 'true' ||
      needs.changes.outputs.worker   == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            changed:    ${{ needs.changes.outputs.frontend }}
            dockerfile: apps/ui/Dockerfile
            context:    apps/ui
          - component: backend
            changed:    ${{ needs.changes.outputs.backend }}
            dockerfile: apps/api/Dockerfile
            context:    .
          - component: worker
            changed:    ${{ needs.changes.outputs.worker }}
            dockerfile: apps/worker/Dockerfile
            context:    .
    outputs:
      # Forward tags to write-back job (step 4 will consume these)
      frontend-tag: ${{ steps.tag.outputs.frontend }}
      backend-tag:  ${{ steps.tag.outputs.backend }}
      worker-tag:   ${{ steps.tag.outputs.worker }}

    steps:
      - name: Skip if unchanged
        if: matrix.changed != 'true'
        run: echo "Component ${{ matrix.component }} unchanged — skipping."

      - uses: actions/checkout@v4
        if: matrix.changed == 'true'

      - name: Set up Docker Buildx
        if: matrix.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: matrix.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name and tag
        if: matrix.changed == 'true'
        id: img
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/diploma-${{ matrix.component }}"
          TAG="${GITHUB_SHA::8}"
          echo "name=${IMAGE}"         >> $GITHUB_OUTPUT
          echo "tag=${TAG}"            >> $GITHUB_OUTPUT
          echo "full=${IMAGE}:${TAG}"  >> $GITHUB_OUTPUT

      - name: Set tag output (forwarded to write-back)
        if: matrix.changed == 'true'
        id: tag
        run: echo "${{ matrix.component }}=${{ steps.img.outputs.tag }}" >> $GITHUB_OUTPUT

      - name: Build and push
        if: matrix.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context:   ${{ matrix.context }}
          file:      ${{ matrix.dockerfile }}
          push:      true
          platforms: linux/amd64
          tags:      ${{ steps.img.outputs.full }}
          # GHA layer cache — scoped per component so frontend/backend/worker
          # don't evict each other.  Rust layers (~200 MB) are cached here.
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to:   type=gha,scope=${{ matrix.component }},mode=max

      - name: Job summary
        if: matrix.changed == 'true'
        run: |
          echo "### ✅ Image pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Component | \`${{ matrix.component }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ steps.img.outputs.full }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.event.head_commit.message }} |" >> $GITHUB_STEP_SUMMARY
