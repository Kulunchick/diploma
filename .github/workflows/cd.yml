name: CD

on:
  push:
    branches: [main]

# Never cancel CD mid-run.
# Write-back (added in step 4) must not be interrupted by a concurrent push.
concurrency:
  group: cd
  cancel-in-progress: false

permissions:
  contents: write   # write-back commit + push (step 4)
  packages: write   # ghcr.io image push

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Detect which components changed (identical filters to ci.yml)
  # ──────────────────────────────────────────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend:  ${{ steps.filter.outputs.backend }}
      worker:   ${{ steps.filter.outputs.worker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'apps/ui/**'
            backend:
              - 'apps/api/**'
              - 'libs/operations/**'
              - 'apps/worker/**'
            worker:
              - 'apps/worker/**'
              - 'libs/operations/**'

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Tests — MANDATORY gate before any image is pushed.
  #    An image is never pushed if its component's tests are red.
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Test / ${{ matrix.component }}
    needs: changes
    if: |
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.backend  == 'true' ||
      needs.changes.outputs.worker   == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # run all tests; build-push waits for ALL to succeed
      matrix:
        include:
          - component: frontend
            changed: ${{ needs.changes.outputs.frontend }}
          - component: backend
            changed: ${{ needs.changes.outputs.backend }}
          - component: worker
            changed: ${{ needs.changes.outputs.worker }}
    steps:
      - name: Skip if unchanged
        if: matrix.changed != 'true'
        run: echo "Component ${{ matrix.component }} unchanged — skipping."

      - uses: actions/checkout@v4
        if: matrix.changed == 'true'

      # ── Frontend ──────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        if: matrix.changed == 'true' && matrix.component == 'frontend'
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/ui/package-lock.json

      - name: Frontend — install + lint + typecheck
        if: matrix.changed == 'true' && matrix.component == 'frontend'
        run: npm ci && npm run lint && npx tsc --noEmit
        working-directory: apps/ui

      # ── Backend ───────────────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        if: matrix.changed == 'true' && matrix.component == 'backend'
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v5
        if: matrix.changed == 'true' && matrix.component == 'backend'

      - uses: actions/cache@v4
        if: matrix.changed == 'true' && matrix.component == 'backend'
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('apps/api/uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Backend — install deps
        if: matrix.changed == 'true' && matrix.component == 'backend'
        run: uv sync --frozen
        working-directory: apps/api

      # ── Worker ────────────────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        if: matrix.changed == 'true' && matrix.component == 'worker'
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v5
        if: matrix.changed == 'true' && matrix.component == 'worker'

      - name: Cache Cargo registry (worker)
        if: matrix.changed == 'true' && matrix.component == 'worker'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            libs/operations/target
          key: cargo-${{ runner.os }}-${{ hashFiles('libs/operations/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install Rust + maturin (worker)
        if: matrix.changed == 'true' && matrix.component == 'worker'
        uses: dtolnay/rust-toolchain@stable

      - name: Build assignment_solver wheel (worker)
        if: matrix.changed == 'true' && matrix.component == 'worker'
        run: |
          pip install maturin
          maturin build --release --interpreter python3.13
        working-directory: libs/operations

      - name: Worker — install + pytest
        if: matrix.changed == 'true' && matrix.component == 'worker'
        run: |
          pip install -e ".[dev]"
          pip install ../libs/operations/target/wheels/assignment_solver-*.whl \
              --force-reinstall --no-deps
          pytest tests/ -q
        working-directory: apps/worker

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Build + push to ghcr.io (only if ALL tests above passed)
  #    Tag: immutable 8-char git SHA.  latest is never used.
  # ──────────────────────────────────────────────────────────────────────────
  build-push:
    name: Build & Push / ${{ matrix.component }}
    needs: [changes, test]
    # Re-check change flags; if test was skipped (nothing changed) this is also false.
    if: |
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.backend  == 'true' ||
      needs.changes.outputs.worker   == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            changed:    ${{ needs.changes.outputs.frontend }}
            dockerfile: apps/ui/Dockerfile
            context:    apps/ui
          - component: backend
            changed:    ${{ needs.changes.outputs.backend }}
            dockerfile: apps/api/Dockerfile
            context:    .
          - component: worker
            changed:    ${{ needs.changes.outputs.worker }}
            dockerfile: apps/worker/Dockerfile
            context:    .
    steps:
      - name: Skip if unchanged
        if: matrix.changed != 'true'
        run: echo "Component ${{ matrix.component }} unchanged — skipping."

      - uses: actions/checkout@v4
        if: matrix.changed == 'true'

      - name: Set up Docker Buildx
        if: matrix.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: matrix.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name and tag
        if: matrix.changed == 'true'
        id: img
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/diploma-${{ matrix.component }}"
          TAG="${GITHUB_SHA::8}"
          echo "name=${IMAGE}"         >> $GITHUB_OUTPUT
          echo "tag=${TAG}"            >> $GITHUB_OUTPUT
          echo "full=${IMAGE}:${TAG}"  >> $GITHUB_OUTPUT

      - name: Build and push
        if: matrix.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context:   ${{ matrix.context }}
          file:      ${{ matrix.dockerfile }}
          push:      true
          platforms: linux/amd64
          tags:      ${{ steps.img.outputs.full }}
          # GHA layer cache — scoped per component so frontend/backend/worker
          # don't evict each other.  Rust layers (~200 MB) are cached here.
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to:   type=gha,scope=${{ matrix.component }},mode=max

      - name: Job summary
        if: matrix.changed == 'true'
        run: |
          echo "### ✅ Image pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Component | \`${{ matrix.component }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ steps.img.outputs.full }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.event.head_commit.message }} |" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────────────────────────────
  # 4. Write-back: update image.tag in Helm values.yaml for changed charts,
  #    commit [skip ci], rebase-pull, push.
  #
  #    Runs in the same concurrency group 'cd' (cancel-in-progress: false),
  #    so only one write-back executes at a time → no parallel git conflicts.
  #
  #    Why no conflict even without rebase in the normal case:
  #      The CD group serialises runs. If a second push queued while build
  #      was running, it starts after the first write-back lands, so it
  #      picks up the already-bumped values.yaml. The rebase is a safety net
  #      for the rare manual push that slips through during the build phase.
  #
  #    Branch protection TODO: see DEPLOY.md — if main is protected,
  #    GITHUB_TOKEN push may be rejected. Choose option A or B from that doc.
  # ──────────────────────────────────────────────────────────────────────────
  writeback:
    name: Write-back image tags
    needs: [changes, build-push]
    if: |
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.backend  == 'true' ||
      needs.changes.outputs.worker   == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Pushes made with GITHUB_TOKEN do NOT re-trigger workflows.
          # [skip ci] in the commit message is an additional safety belt.
          token: ${{ secrets.GITHUB_TOKEN }}
          # Fetch full history so rebase has enough context.
          fetch-depth: 0

      - name: Compute immutable SHA tag
        id: sha
        run: echo "tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      # Update image.tag in each changed chart's values.yaml.
      # sed targets the line "  tag: <anything>" (2-space indent under image:).
      # The values.yaml structure is controlled — only one such line per file.
      - name: Bump frontend image.tag
        if: needs.changes.outputs.frontend == 'true'
        run: |
          sed -i "s/^  tag: .*$/  tag: ${{ steps.sha.outputs.tag }}/" \
            deploy/charts/frontend/values.yaml

      - name: Bump backend image.tag
        if: needs.changes.outputs.backend == 'true'
        run: |
          sed -i "s/^  tag: .*$/  tag: ${{ steps.sha.outputs.tag }}/" \
            deploy/charts/backend/values.yaml

      - name: Bump worker image.tag
        if: needs.changes.outputs.worker == 'true'
        run: |
          sed -i "s/^  tag: .*$/  tag: ${{ steps.sha.outputs.tag }}/" \
            deploy/charts/worker/values.yaml

      - name: Commit → rebase → push [skip ci]
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add deploy/charts/frontend/values.yaml \
                  deploy/charts/backend/values.yaml  \
                  deploy/charts/worker/values.yaml

          # Nothing to commit if all components were unchanged (shouldn't
          # happen given the job's if-condition, but guard anyway).
          if git diff --cached --quiet; then
            echo "No values.yaml changes — nothing to commit."
            exit 0
          fi

          git commit -m "chore(cd): bump image tags to ${{ steps.sha.outputs.tag }} [skip ci]"

          # Rebase our commit on top of any new remote commits that arrived
          # during the build phase (manual push, hotfix, etc.).
          git pull --rebase origin main

          git push origin main

      - name: Write-back summary
        run: |
          SHA="${{ steps.sha.outputs.tag }}"
          echo "### 🏷️ Values.yaml bumped" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tag: \`${SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Chart | Changed |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| frontend | ${{ needs.changes.outputs.frontend }} |" >> $GITHUB_STEP_SUMMARY
          echo "| backend  | ${{ needs.changes.outputs.backend }} |"  >> $GITHUB_STEP_SUMMARY
          echo "| worker   | ${{ needs.changes.outputs.worker }} |"   >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Argo CD will auto-sync within seconds." >> $GITHUB_STEP_SUMMARY
