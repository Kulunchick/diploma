version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------

  postgresql:
    image: postgres:16-alpine
    container_name: dev-postgresql
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.26
    container_name: dev-temporal
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgresql
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  temporal-ui:
    image: temporalio/ui:latest
    container_name: dev-temporal-ui
    depends_on:
      temporal:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: "http://localhost:3000,http://localhost:8000"
    ports:
      - "8233:8080"

  redis:
    image: redis:7-alpine
    container_name: dev-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Application database (information system) — kept separate from Temporal's
  # own postgres so the two have independent lifecycles, backups and migrations.
  appdb:
    image: postgres:16
    container_name: dev-appdb
    environment:
      POSTGRES_DB: diploma
      POSTGRES_USER: diploma
      POSTGRES_PASSWORD: diploma
    ports:
      - "5432:5432"
    volumes:
      - appdb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diploma -d diploma"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Application
  # ---------------------------------------------------------------------------

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: dev-api
    depends_on:
      temporal:
        condition: service_started
      redis:
        condition: service_healthy
      appdb:
        condition: service_healthy
    environment:
      PYTHONUNBUFFERED: "1"
      TEMPORAL_HOST: temporal:7233
      TEMPORAL_NAMESPACE: default
      TASK_QUEUE: operations
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql+asyncpg://diploma:diploma@appdb:5432/diploma
      JWT_SECRET: dev-secret-change-me
    ports:
      - "8000:8000"
    command: ["python", "-m", "src.operations.main"]

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: dev-worker
    depends_on:
      temporal:
        condition: service_started
      redis:
        condition: service_healthy
      appdb:
        condition: service_healthy
    environment:
      PYTHONUNBUFFERED: "1"
      TEMPORAL_HOST: temporal:7233
      TEMPORAL_NAMESPACE: default
      TASK_QUEUE: operations
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql+asyncpg://diploma:diploma@appdb:5432/diploma
    command: ["python", "-m", "worker.main"]

  ui:
    build:
      context: ./apps/ui
      dockerfile: Dockerfile
      args:
        # VITE_* vars are baked into the JS bundle at build time by Vite.
        # The browser connects to the API via localhost — not the container name.
        VITE_WS_BASE_URL: ws://localhost:8000
    container_name: dev-ui
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  appdb-data:
