version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------

  postgresql:
    image: postgres:16-alpine
    container_name: dev-postgresql
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.26
    container_name: dev-temporal
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgresql
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  temporal-ui:
    image: temporalio/ui:latest
    container_name: dev-temporal-ui
    depends_on:
      temporal:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: "http://localhost:3000,http://localhost:8000"
    ports:
      - "8233:8080"

  redis:
    image: redis:7-alpine
    container_name: dev-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # Application
  # ---------------------------------------------------------------------------

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: dev-api
    depends_on:
      temporal:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      PYTHONUNBUFFERED: "1"
      TEMPORAL_HOST: temporal:7233
      TEMPORAL_NAMESPACE: default
      TASK_QUEUE: coursework-operations
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    command: ["python", "-m", "src.coursework_operations.main"]

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: dev-worker
    depends_on:
      temporal:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      PYTHONUNBUFFERED: "1"
      TEMPORAL_HOST: temporal:7233
      TEMPORAL_NAMESPACE: default
      TASK_QUEUE: coursework-operations
      REDIS_URL: redis://redis:6379
    command: ["python", "-m", "src.worker.main"]
